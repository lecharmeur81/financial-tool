# Capital Flow Intelligence — development environment.
#   1. Copy .env.example to .env and set the passwords.
#   2. docker compose up --build
#   Frontend: http://localhost:3000   API: http://localhost:8000/api/docs
# All ports are bound to 127.0.0.1 only (not reachable from other machines).

name: cfi

x-backend-env: &backend-env
  CFI_ENVIRONMENT: development
  CFI_LOG_LEVEL: ${CFI_LOG_LEVEL:-INFO}
  CFI_LOG_FORMAT: ${CFI_LOG_FORMAT:-json}
  CFI_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:?set POSTGRES_DB in .env}
  CFI_REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis:6379/0
  CFI_RAW_ARCHIVE_DIR: /data/raw
  # Market data (Phase 5): providers the workers ingest from; optional free CoinGecko Demo key.
  CFI_MARKET_PROVIDERS: ${CFI_MARKET_PROVIDERS:-coinbase,kraken,binance,okx,bybit,coingecko}
  CFI_MARKET_BACKFILL_DAYS: ${CFI_MARKET_BACKFILL_DAYS:-}
  CFI_PROVIDER_COINGECKO_API_KEY: ${CFI_PROVIDER_COINGECKO_API_KEY:-}
  # Institutional capital (Phase 6): SoSoValue needs a free API key; without it its jobs are skipped.
  CFI_INSTITUTIONAL_PROVIDERS: ${CFI_INSTITUTIONAL_PROVIDERS:-sosovalue,coingecko}
  CFI_PROVIDER_SOSOVALUE_API_KEY: ${CFI_PROVIDER_SOSOVALUE_API_KEY:-}
  # Whale intelligence (Phase 7): Coin Metrics Community and Blockchair, both work without a key.
  CFI_WHALE_PROVIDERS: ${CFI_WHALE_PROVIDERS:-coinmetrics,blockchair}
  CFI_PROVIDER_BLOCKCHAIR_API_KEY: ${CFI_PROVIDER_BLOCKCHAIR_API_KEY:-}
  # Derivatives (Phase 8): Binance USDⓈ-M, OKX and Deribit public data, no key.
  CFI_DERIVATIVE_PROVIDERS: ${CFI_DERIVATIVE_PROVIDERS:-binance_futures,okx_derivatives,deribit}

x-backend-build: &backend-build
  context: ./backend
  target: dev

services:
  db:
    image: timescale/timescaledb:2.30.1-pg17
    command: ["postgres", "-c", "timescaledb.telemetry_level=off"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:8.8-alpine
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly yes"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
      REDISCLI_AUTH: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  migrate:
    build: *backend-build
    image: cfi-backend:dev
    command: ["alembic", "upgrade", "head"]
    environment: *backend-env
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build: *backend-build
    image: cfi-backend:dev
    environment: *backend-env
    volumes:
      - rawarchive:/data/raw
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # Background ingestion (Celery, ADR-0023). Recent data and history backfill run in separate
  # processes so a long backfill never delays the latest bars.
  worker:
    build: *backend-build
    image: cfi-backend:dev
    command: ["celery", "-A", "cfi.worker.app", "worker", "-Q", "ingest_fast,ingest",
              "--concurrency=1", "--hostname=ingest@%h", "--loglevel=INFO"]
    environment: *backend-env
    volumes:
      - rawarchive:/data/raw
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker-backfill:
    build: *backend-build
    image: cfi-backend:dev
    command: ["celery", "-A", "cfi.worker.app", "worker", "-Q", "backfill",
              "--concurrency=1", "--hostname=backfill@%h", "--loglevel=INFO"]
    environment: *backend-env
    volumes:
      - rawarchive:/data/raw
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  beat:
    build: *backend-build
    image: cfi-backend:dev
    command: ["celery", "-A", "cfi.worker.app", "beat", "--schedule", "/tmp/celerybeat-schedule",
              "--loglevel=INFO"]
    environment: *backend-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    image: cfi-frontend:dev
    environment:
      API_INTERNAL_URL: http://api:8000
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  rawarchive:
