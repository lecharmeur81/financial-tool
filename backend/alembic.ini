# Alembic configuration. The database URL is NOT stored here: migrations/env.py reads
# CFI_DATABASE_URL from the environment (CLAUDE.md R9).
[alembic]
script_location = %(here)s/migrations
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
prepend_sys_path = src
timezone = UTC
path_separator = os

[loggers]
keys = root

[handlers]
keys =

[formatters]
keys =

[logger_root]
level = WARNING
handlers =
