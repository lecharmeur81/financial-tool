[project]
name = "cfi"
version = "0.1.0"
description = "Capital Flow Intelligence — backend API, data engine, and workers"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.0",
    "celery[redis]>=5.6.3",
    "fastapi>=0.141.1",
    "httpx2>=2.13.1",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "redis>=6.4.0,<6.5",
    "sqlalchemy[asyncio]>=2.0.54",
    "structlog>=26.1.0",
    "tzdata>=2026.4",
    "uvicorn[standard]>=0.53.0",
]

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "celery-types>=0.26.0",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.8",
]

# ---------------------------------------------------------------- ruff (lint + format)
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # import sorting
    "B",        # bugbear
    "UP",       # pyupgrade
    "N",        # naming
    "S",        # security (bandit)
    "DTZ",      # timezone-naive datetimes are forbidden (CLAUDE.md C4)
    "ASYNC",    # async pitfalls
    "RUF",      # ruff-specific
    "PT",       # pytest style
    "SIM",      # simplifications
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]  # asserts and dummy test credentials are fine in tests
"migrations/**" = ["N999"]
# User-facing formulas use real math symbols (−, ×, ÷, –); they are intentional, not confusables.
"src/cfi/institutional/**" = ["RUF001", "RUF002"]
"src/cfi/whales/**" = ["RUF001", "RUF002"]
"src/cfi/derivatives/**" = ["RUF001", "RUF002"]
"src/cfi/liquidity/**" = ["RUF001", "RUF002", "RUF003"]
"src/cfi/macro/**" = ["RUF001", "RUF002", "RUF003"]
"src/cfi/market_structure/**" = ["RUF001", "RUF002", "RUF003"]
"src/cfi/divergence/**" = ["RUF001", "RUF002", "RUF003"]
"src/cfi/rotation/**" = ["RUF001", "RUF002", "RUF003"]
"src/cfi/providers/{binance_futures,okx_derivatives}.py" = ["RUF001", "RUF002"]
"tests/**/*derivative*.py" = ["RUF001", "RUF002", "RUF003", "S101"]
"src/cfi/providers/blockchair.py" = ["RUF002"]
"src/cfi/core/calendars.py" = ["RUF002"]

# ---------------------------------------------------------------- mypy (type checking)
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
files = ["src", "tests", "migrations"]
explicit_package_bases = true
warn_unreachable = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
markers = [
    "integration: needs a real PostgreSQL+TimescaleDB and Redis (CFI_DATABASE_URL, CFI_REDIS_URL)",
]
filterwarnings = [
    "error",
    # Third-party: starlette.testclient (1.6.0) still uses an anyio alias deprecated upstream.
    # Remove when starlette updates. Every other warning stays an error.
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]
